x-podman:
  in_pod: false

services:
  postgres:
    image: postgres:18
    container_name: expense-tracker-db
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:13-alpine
    container_name: expense-tracker-flyway
    command: migrate
    volumes:
      - ./backend/migrations:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/expense_tracker
      FLYWAY_USER: ${DB_USER:-postgres}
      FLYWAY_PASSWORD: ${DB_PASSWORD:-postgres}
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    depends_on:
      postgres:
        condition: service_healthy
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: expense-tracker-keycloak
    env_file:
      - .env
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/export:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy

  keycloak-config:
    image: curlimages/curl:latest
    container_name: expense-tracker-keycloak-config
    env_file:
      - .env
    volumes:
      - ./docker/keycloak/configure-idps.sh:/configure-idps.sh:ro
    command: sh /configure-idps.sh
    depends_on:
      keycloak:
        condition: service_started
  api:
    build:
      context: ./backend
    container_name: expense-tracker-api
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_PORT:-3000}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-expense_tracker}?schema=public
      KEYCLOAK_URL: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:-defaultsecret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-default}
      PLAID_SECRET: ${PLAID_SECRET:-default}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:3000/health'',r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
    container_name: expense-tracker-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BACKEND_URL: http://localhost:3000
      KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - api

  mcp-server:
    build:
      context: ./mcp-server
    container_name: expense-tracker-mcp-server
    env_file:
      - ./mcp-server/.env
    environment:
      EXPENSE_API_BASE_URL: http://api:3000/api/v1
      MCP_HTTP_HOST: 0.0.0.0
    ports:
      - "3400:3400"
    depends_on:
      - api
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:3400/health'',r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
  metabase:
    image: metabase/metabase:v0.56.x
    container_name: expense-tracker-metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${DB_USER:-postgres}
      MB_DB_PASS: ${DB_PASSWORD:-postgres}
      MB_DB_HOST: postgres
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
  pg-backup: # for backup on demand and restoration IT IS NEEDED
    build:
      context: ./docker/postgres/backup
    image: expense-tracker-pg-backup:latest
    container_name: expense-tracker-pg-backup
    environment:
      POSTGRES_DB: ${DB_NAME:-expense_tracker}
      POSTGRES_USER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      BACKUP_DIR: /backup
      RCLONE_CONFIG: /secrets/rclone.conf
      RCLONE_REMOTE: ${RCLONE_REMOTE}
      RCLONE_BACKUP_FOLDER: ${RCLONE_BACKUP_FOLDER}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
    volumes:
      - ./backups:/backup
      - ./docker/postgres/backup/rclone.conf:/secrets/rclone.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
